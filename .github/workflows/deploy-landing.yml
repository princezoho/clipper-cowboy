name: Deploy landing site

# Publishes the static site/ folder to GitHub Pages. Pages is enabled on this
# repository with Settings > Pages > Source = GitHub Actions, so no account
# action is outstanding.
#
# Every push to main that touches site/ deploys. The path filter keeps app and
# server commits from queueing a Pages deployment that would publish identical
# bytes. Use Run workflow when you need to republish without a site/ change.
#
# The site is live at the default Pages address,
# https://princezoho.github.io/clipper-cowboy/.
#
# To move to clippercowboy.jejestudios.com later:
#   1. Add the DNS records listed in site/README.md.
#   2. Enter the domain in Settings > Pages > Custom domain. GitHub commits the
#      CNAME file itself, so do not add one here by hand.
#   3. Update the canonical link and the og:/twitter: URLs in site/index.html.
# No CNAME file is added deliberately: committing one while DNS still points
# elsewhere breaks the working default Pages URL.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

# Least privilege for a Pages deployment: read the repo, mint an OIDC token,
# write the Pages deployment. No contents: write is needed.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
