name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install MCP dependencies
        run: npm --prefix mcp ci
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev
          # MCP is gated at "high" rather than the default, to knowingly exclude
          # GHSA-frvp-7c67-39w9: path traversal in @hono/node-server serve-static
          # (moderate, reported twice - directly and via @modelcontextprotocol/sdk).
          # No fix exists: the SDK requires @hono/node-server ^1.19.9 and the
          # advisory is only patched in 2.0.5, so neither `npm audit fix` nor
          # `--force` can resolve it. Not reachable here - mcp/src/index.ts uses
          # StdioServerTransport only, hono is imported solely by the SDK's
          # streamableHttp transport, and serve-static is never used.
          # Re-tighten to the default level once the SDK moves to hono >=2.0.5.
          npm --prefix mcp audit --omit=dev --audit-level=high
      - name: Verify app and MCP
        run: npm run verify
      - name: Public-readiness preflight
        run: npm run public:ready
